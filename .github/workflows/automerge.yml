name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-merge-ready:
    name: Check Merge Ready
    runs-on: ubuntu-latest
    outputs:
      can_merge: ${{ steps.check.outputs.can_merge }}
      pr_number: ${{ steps.check.outputs.pr_number }}
      pr_title: ${{ steps.check.outputs.pr_title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check PR
        id: check
        run: |
          PR=$(gh pr view --json number,title,mergeStateStatus,reviewDecision,statusCheckRollup -q '.number')
          if [ -z "$PR" ]; then
            echo "can_merge=false" >> $GITHUB_OUTPUT
            echo "No mergeable PR found"
            exit 0
          fi
          
          STATE=$(gh pr view $PR --json mergeStateStatus -q '.mergeStateStatus')
          REVIEW=$(gh pr view $PR --json reviewDecision -q '.reviewDecision')
          TITLE=$(gh pr view $PR --json title -q '.title')
          
          if [ "$STATE" == "MERGEABLE" ] && [ "$REVIEW" == "APPROVED" ]; then
            echo "can_merge=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR" >> $GITHUB_OUTPUT
            echo "pr_title=$TITLE" >> $GITHUB_OUTPUT
          else
            echo "can_merge=false" >> $GITHUB_OUTPUT
            echo "PR $PR not ready: state=$STATE review=$REVIEW"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  automerge:
    name: Auto Merge PR
    needs: check-merge-ready
    if: needs.check-merge-ready.outputs.can_merge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Auto merge
        run: |
          gh pr merge ${{ needs.check-merge-ready.outputs.pr_number }} \
            --admin \
            --auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Notify on Failure
    needs: [check-merge-ready, automerge]
    if: always() && needs.check-merge-ready.outputs.can_merge == 'true' && needs.automerge.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        run: |
          echo "Auto merge failed for PR #{{ needs.check-merge-ready.outputs.pr_number }}"
          echo "Title: ${{ needs.check-merge-ready.outputs.pr_title }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}