name: Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint (iOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: SwiftLint
        run: |
          if command -v swiftlint &>/dev/null; then
            swiftlint --config ios/.swiftlint.yml
          else
            echo "Installing swiftlint..."
            brew install swiftlint
            swiftlint --config ios/.swiftlint.yml
          fi

  swift-format:
    name: Swift Format Check
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "5.9"

      - name: Check Swift Format
        run: |
          brew list swift-format &>/dev/null || brew install swift-format
          swift-format lint --recursive ios/Ninehoto/

  swift-static-analysis:
    name: Swift Static Analysis
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: cd ios && xcodegen generate

      - name: Run Swift Analyzer
        run: |
          xcodebuild -project ios/Ninehoto.xcodeproj \
            -scheme Ninehoto \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            analyze 2>&1 | grep -E "(error:|warning:)" | head -30

  code-coverage-report:
    name: Code Coverage Report
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate Project
        run: cd ios && xcodegen generate

      - name: Run Tests with Coverage
        run: |
          xcodebuild test -project ios/Ninehoto.xcodeproj \
            -scheme Ninehoto \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -30

  ios-build-check:
    name: iOS Build Check
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios && xcodegen generate

      - name: Build iOS
        run: |
          xcodebuild -project ios/Ninehoto.xcodeproj \
            -scheme Ninehoto \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  file-checks:
    name: File & Format Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for debug output / TODO comments
        run: |
          echo "=== Checking for console.log / print statements ==="
          ! grep -r "console.log\|Swift\.print\|System\.Debug\|Android\.Util\.Log" \
            --include="*.swift" --include="*.cs" \
            ios/ android/Ninehoto.Android/ 2>/dev/null || true

          echo "=== Checking for TODO/FIXME in production code ==="
          ! grep -rn "TODO:\|FIXME:\|HACK:" \
            --include="*.swift" --include="*.cs" \
            ios/Ninehoto/ android/Ninehoto.Android/ 2>/dev/null || true

          echo "=== Checking for hardcoded secrets ==="
          ! grep -rn "api_key\|secret\|password\s*=" \
            --include="*.swift" --include="*.cs" --include="*.yml" \
            --exclude="*.xcodeproj" --exclude="project.yml" \
            ios/Ninehoto/ android/Ninehoto.Android/ 2>/dev/null || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
