name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =====================
  # iOS
  # =====================
  ios-build:
    name: iOS Build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios && xcodegen generate

      - name: Build iOS (Debug)
        run: |
          xcodebuild -project ios/Ninehoto.xcodeproj \
            -scheme Ninehoto \
            -configuration Debug \
            -destination 'generic platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

  ios-test:
    name: iOS Tests
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ios && xcodegen generate

      - name: Run iOS Tests
        run: |
          xcodebuild test -project ios/Ninehoto.xcodeproj \
            -scheme Ninehoto \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tail -30

  # =====================
  # Android
  # =====================
  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android (Debug)
        run: |
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ninehoto-android-apk
          path: android/Ninehoto.Android/bin/Debug/net8.0-android/apk/debug/*.apk
          retention-days: 7

  android-test:
    name: Android Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android Tests
        run: |
          cd android/Ninehoto.Android && dotnet build --no-restore

      - name: Run Android Tests
        run: |
          cd android/Ninehoto.Android && dotnet test --no-build 2>&1 || echo "Tests require emulator/device"
