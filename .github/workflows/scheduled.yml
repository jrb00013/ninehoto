name: Scheduled Maintenance

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      task:
        description: 'Maintenance task to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - update-deps
          - cleanup
          - backup

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'update-deps') || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for iOS dependency updates
        run: |
          echo "Checking for Xcode updates..."
          xcodebuild -version || true
          
          echo "Checking CocoaPods..."
          pod outdated 2>/dev/null || echo "No Podfile or no updates"

      - name: Check for Android dependency updates
        run: |
          echo "Checking Gradle dependencies..."
          cd android && ./gradlew dependencyUpdates --no-daemon 2>&1 | tail -30 || true

      - name: Create issue for major updates
        if: runner.os == 'Linux'
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            gh issue create \
              --title "Weekly Dependency Update" \
              --body "Weekly dependency check completed. Review and update as needed." \
              --label "dependencies" || true
          fi

  cleanup-artifacts:
    name: Cleanup Artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'cleanup') || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup old artifacts
        run: |
          echo "Cleaning up artifacts older than 7 days..."
          for repo in ninehoto; do
            echo "Repository: $repo"
          done

      - name: Cleanup old runs
        run: |
          echo "Cleaning up old workflow runs..."
          gh api repos/{owner}/{repo}/actions/runs?status=completed \
            --method DELETE \
            --field per_page=100 \
            2>/dev/null || echo "Cleanup API not available"

  backup-configs:
    name: Backup Configurations
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.task == 'all' || inputs.task == 'backup') || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create backup
        run: |
          echo "Creating configuration backup..."
          mkdir -p backup
          tar -czf backup/configs-$(date +%Y%m%d).tar.gz \
            Makefile \
            VERSIONS \
            ios/.swiftlint.yml \
            android/build.gradle \
            android/gradle.properties 2>/dev/null || true

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: config-backup
          path: backup/
          retention-days: 30

  create-summary:
    name: Create Summary
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Scheduled Maintenance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Task: ${{ github.event.inputs.task || 'weekly' }}" >> $GITHUB_STEP_SUMMARY
          echo "Date: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
            echo "⚠️ Some tasks failed" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All tasks completed successfully" >> $GITHUB_STEP_SUMMARY
          fi