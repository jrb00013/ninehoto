# .swiftlint.yml
# SwiftLint configuration for ninehoto iOS project
# Run: swiftlint

disabled_rules:
  - trailing_whitespace
  - file_length
  - line_length

excluded:
  - Ninehoto.xcodeproj
  - Ninehoto.app
  - DerivedData
  - NinehotoTests
  - .build

opt_in_rules:
  - empty_count
  - closure_spacing
  - contains_over_first_not_nil
  - first_where
  - redundant_nil_coalescing
  - contains_over_first_not_nil
  - redundant_type_annotation
  - sorted_first_last
  - strict_fileprivate
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - empty_xctest_message
  - multiline_parameters
  - untyped_header_in_conditional_compilation_directive

force_cast: error
force_try: error

type_body_length:
  warning: 300
  error: 400

function_body_length:
  warning: 50
  error: 100

file_length:
  warning: 500
  error: 1000

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
    error: 60

type_name:
  min_length: 3
  max_length:
    warning: 40
    error: 60

warning_threshold: 5
error_threshold: 15

reporter: "xcode"