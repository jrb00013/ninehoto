name: Ninehoto
options:
  bundleIdPrefix: com.ninehoto
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    INFOPLIST_FILE: Ninehoto/Info.plist
    INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen

targets:
  Ninehoto:
    type: application
    platform: iOS
    sources:
      - path: Ninehoto
        excludes:
          - "*.xcodeproj"
          - "*.xcworkspace"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninehoto.app
        INFOPLIST_FILE: Ninehoto/Info.plist
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen

  NinehotoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NinehotoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ninehoto.app.tests
        INFOPLIST_FILE: NinehotoTests/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ninehoto.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Ninehoto"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Ninehoto
